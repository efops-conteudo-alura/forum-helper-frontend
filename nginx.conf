# Configuração do nginx do container do frontend (vira /etc/nginx/conf.d/default.conf).
# Espelha o vercel.json: o navegador só fala com este domínio, então o cookie de sessão (FORUM_SESSION) é first-party.
#
#   /auth/*        -> API  /auth/*   (início do login Microsoft e callback)
#   /forum-api/*   -> API  /api/*    (o app chama /forum-api; a API Java usa o prefixo /api)
#   demais rotas   -> index.html     (o roteador do React decide)
#
# A API é o serviço "backend" do docker-compose e nunca é publicada fora da rede interna: só estes dois prefixos chegam
# a ela, então /actuator e /swagger-ui não ficam acessíveis pela internet.

# DNS interno do Docker. O nome é resolvido a cada 10 s, porque o IP do backend muda quando ele reinicia (com o nome
# fixo no proxy_pass o nginx guardaria o IP antigo e passaria a responder 502).
resolver 127.0.0.11 valid=10s ipv6=off;

# Quem termina o HTTPS é o proxy da VPS, na frente deste container. Ele informa o esquema e o host originais nos
# cabeçalhos X-Forwarded-*; sem eles, caímos para o que este nginx enxerga.
map $http_x_forwarded_proto $proto_externo {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $host_externo {
    default $http_x_forwarded_host;
    ""      $host;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Corpo pequeno: a API só recebe JSON curto.
    client_max_body_size 2m;

    # Para o healthcheck do compose (não consulta a API, só diz que o nginx está de pé).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    set $backend http://backend:8080;

    location /forum-api/ {
        rewrite ^/forum-api/(.*)$ /api/$1 break;
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy-api.inc;
    }

    location /auth/ {
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy-api.inc;
    }

    # Arquivos com hash no nome (assets/): nunca mudam, podem ficar em cache por um ano.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Dump do catálogo (5 MB): muda raramente, mas sem hash no nome.
    location /data/ {
        try_files $uri =404;
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # O resto é o app: o index.html nunca fica em cache, para um deploy novo valer na hora.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
