name: Publicar imagem

# Constrói a imagem Docker do frontend e publica no GitHub Container Registry (ghcr.io), de onde a VPS baixa.
# A compilação acontece aqui, e não na VPS, para não gastar CPU e memória de uma máquina compartilhada.
#
# Configuração necessária no repositório (Settings > Secrets and variables > Actions > Variables):
#   VITE_FIREBASE_API_KEY   chave web do Firebase do mural (vai embutida no JavaScript do site, não é segredo)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publicar-imagem
  cancel-in-progress: true

jobs:
  imagem:
    name: Construir e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nomes e etiquetas da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SSO_ENABLED=true
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
